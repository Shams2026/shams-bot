name: "1- Shams: Attendance Alert"

on:
  workflow_dispatch:

jobs:
  run-absent-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install requests
      - run: python absent.py  # تأكد أن الاسم هنا يطابق اسم ملف البايثون تماماً
