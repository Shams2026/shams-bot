name: Shams Bot Run

on:
  workflow_dispatch: # لتشغيله يدوياً
  schedule:
    - cron: '15 13 * * *' # يعمل تلقائياً 3:15 عصرًا بتوقيت مصر

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run Bot
        run: python bot.py
