name: تنبيه فتح اليوتيوب الان
on:
  repository_dispatch:
    types: [youtube_opened] # كلمة السر التي يرسلها ملف absent من جهازك

jobs:
  send_telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        run: |
          # الحصول على الوقت والتاريخ الحاليين
          DATE=$(date +'%Y-%m-%d')
          TIME=$(date +'%H:%M:%S')
          
          # نص الرسالة (الاسم، التاريخ، الوقت)
          MESSAGE="⚠️ تنبيه من بوت Shams%0A----------%0A👤 الاسم: طالب مجتهد%0A🚫 النشاط: فتح اليوتيوب الآن%0A📅 التاريخ: $DATE%0A🕒 الوقت: $TIME"
          
          # إرسال الإشعار لتليجرام
          curl -s -X POST "https://api.telegram.org/bot7647299098:AAEmA8FKF_KujX5NbclGMP-cZWFDcTAFA7s/sendMessage" \
          -d "chat_id=-5202473852" \
          -d "text=$MESSAGE"
